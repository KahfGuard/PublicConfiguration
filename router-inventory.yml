# =====================================================================
#  ISP Router Inventory
#  Each router needs SSH access with MikroTik RouterOS
# =====================================================================
#
#  Required GitHub Secrets per router:
#    ROUTER_<NAME>_HOST     - IP address or hostname
#    ROUTER_<NAME>_SSH_KEY  - SSH private key (ed25519 or RSA)
#    ROUTER_<NAME>_USER     - SSH username (default: admin)
#    ROUTER_<NAME>_PORT     - SSH port (default: 22)
#
#  Example for router "isp-dhaka":
#    ROUTER_ISP_DHAKA_HOST     = 103.25.100.1
#    ROUTER_ISP_DHAKA_SSH_KEY  = -----BEGIN OPENSSH PRIVATE KEY-----...
#    ROUTER_ISP_DHAKA_USER     = admin
#    ROUTER_ISP_DHAKA_PORT     = 22
#
#  Usage: Referenced by deploy-router-config.yml workflow
# =====================================================================

